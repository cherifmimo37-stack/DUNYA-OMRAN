<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>DUNYA OMRAN | المشروع</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

:root{
    --petroleum:#123B4A;
    --dark:#0B2934;
    --green:#3F6B63;
    --copper:#C47735;
    --ivory:#F5F3EE;
    --stone:#68757A;
    --white:#ffffff;
    --red:#b94a48;
    --shadow:0 10px 30px rgba(11,41,52,.10);
    --radius:20px;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Cairo",sans-serif;
    background:var(--ivory);
    color:var(--dark);
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* HEADER */

.header{
    background:
        linear-gradient(
            135deg,
            var(--dark),
            var(--petroleum)
        );

    color:white;
    padding:20px 18px 28px;

    border-radius:
        0 0 28px 28px;

    box-shadow:var(--shadow);
}

.header-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:13px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:20px;
}

.header-title{
    flex:1;
}

.header-title h1{
    margin:0;
    font-size:21px;
    font-weight:900;
}

.header-title p{
    margin:3px 0 0;
    opacity:.75;
    font-size:12px;
}

.status{
    padding:6px 11px;
    border-radius:30px;
    background:rgba(63,107,99,.35);
    color:#d9eee9;
    font-size:11px;
    font-weight:800;
}

/* PROJECT INFO */

.project-info{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);
    border-radius:20px;
    padding:16px;
}

.location{
    opacity:.8;
    font-size:12px;
}

.progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
}

.progress-value{
    font-size:22px;
    font-weight:900;
    color:#e9c45d;
}

.progress-bar{
    height:9px;
    background:rgba(255,255,255,.12);
    border-radius:20px;
    overflow:hidden;
    margin-top:8px;
}

.progress-fill{
    height:100%;
    background:linear-gradient(
        90deg,
        var(--copper),
        #e9c45d
    );
    border-radius:20px;
}

/* CONTENT */

.container{
    width:min(1100px,94%);
    margin:20px auto 100px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.stat{
    background:white;
    border-radius:18px;
    padding:16px;
    box-shadow:var(--shadow);
    border:1px solid rgba(18,59,74,.05);
}

.stat-icon{
    font-size:25px;
    margin-bottom:8px;
}

.stat-label{
    color:var(--stone);
    font-size:11px;
}

.stat-value{
    margin-top:3px;
    font-size:22px;
    font-weight:900;
}

/* SECTION */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 2px 12px;
}

.section-title h2{
    margin:0;
    font-size:17px;
    font-weight:900;
}

.section-title span{
    color:var(--stone);
    font-size:11px;
}

/* CARDS */

.modules{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.module{
    border:0;
    background:white;
    border-radius:19px;
    padding:18px 14px;
    text-align:right;
    box-shadow:var(--shadow);
    border:1px solid rgba(18,59,74,.05);
    transition:.2s;
}

.module:active{
    transform:scale(.97);
}

.module-icon{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:#eef3f2;
    font-size:24px;
    margin-bottom:10px;
}

.module h3{
    margin:0;
    font-size:14px;
    font-weight:900;
}

.module p{
    margin:5px 0 0;
    font-size:10px;
    color:var(--stone);
}

/* COLORS */

.module.workers .module-icon{
    background:#e9f1ef;
}

.module.materials .module-icon{
    background:#fff0e4;
}

.module.attendance .module-icon{
    background:#edf3f7;
}

.module.expenses .module-icon{
    background:#f8ebe8;
}

.module.reports .module-icon{
    background:#eef0f7;
}

.module.appointments .module-icon{
    background:#fff5df;
}

.module.meetings .module-icon{
    background:#e8f2ef;
}

.module.chat .module-icon{
    background:#e8eef4;
}

.module.photos .module-icon{
    background:#f1eaf5;
}

.module.notifications .module-icon{
    background:#fff0df;
}

/* DETAILS */

.details{
    background:white;
    border-radius:20px;
    padding:18px;
    box-shadow:var(--shadow);
}

.detail{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:11px 0;
    border-bottom:1px solid #eee;
    font-size:12px;
}

.detail:last-child{
    border-bottom:0;
}

.detail span:first-child{
    color:var(--stone);
}

.detail strong{
    text-align:left;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:25px 10px;
    color:var(--stone);
    font-size:12px;
}

/* LOADING */

.loading{
    text-align:center;
    padding:50px 20px;
    color:var(--stone);
}

/* BOTTOM */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:72px;

    background:
        rgba(255,255,255,.96);

    backdrop-filter:blur(12px);

    border-top:1px solid #e8e4df;

    display:flex;
    justify-content:center;

    z-index:50;
}

.bottom-inner{
    width:min(600px,100%);
    display:flex;
}

.bottom-item{
    flex:1;
    border:0;
    background:none;
    color:var(--stone);
    font-size:10px;
    font-weight:700;
}

.bottom-item div{
    font-size:21px;
    margin-bottom:2px;
}

.bottom-item.active{
    color:var(--petroleum);
}

/* DESKTOP */

@media(min-width:700px){

    .stats{
        grid-template-columns:
            repeat(4,1fr);
    }

    .modules{
        grid-template-columns:
            repeat(5,1fr);
    }

}

</style>

</head>

<body>

<div id="loading" class="loading">
    ⏳ جاري تحميل المشروع...
</div>

<div id="app" style="display:none">

<header class="header">

    <div class="header-top">

        <button
            class="back-btn"
            onclick="goBack()">
            ←
        </button>

        <div class="header-title">

            <h1 id="projectName">
                المشروع
            </h1>

            <p id="projectLocation">
                جاري التحميل...
            </p>

        </div>

        <div
            id="projectStatus"
            class="status">
            —
        </div>

    </div>


    <div class="project-info">

        <div class="location">
            تقدم المشروع
        </div>

        <div class="progress-row">

            <span>
                نسبة الإنجاز
            </span>

            <span
                id="progressValue"
                class="progress-value">
                0%
            </span>

        </div>

        <div class="progress-bar">

            <div
                id="progressFill"
                class="progress-fill"
                style="width:0%">
            </div>

        </div>

    </div>

</header>


<main class="container">

    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <div class="stat-icon">👷</div>
            <div class="stat-label">العمال</div>
            <div id="workersCount"
                 class="stat-value">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🧱</div>
            <div class="stat-label">المواد</div>
            <div id="materialsCount"
                 class="stat-value">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">💰</div>
            <div class="stat-label">المصاريف</div>
            <div id="expensesTotal"
                 class="stat-value">0 دج</div>
        </div>

        <div class="stat">
            <div class="stat-icon">📅</div>
            <div class="stat-label">المواعيد</div>
            <div id="appointmentsCount"
                 class="stat-value">0</div>
        </div>

    </div>


    <!-- MODULES -->

    <div class="section-title">

        <h2>
            إدارة المشروع
        </h2>

        <span>
            كل بيانات المشروع
        </span>

    </div>


    <div class="modules">

        <button
            class="module workers"
            onclick="openModule('العمال')">

            <div class="module-icon">
                👷
            </div>

            <h3>العمال</h3>

            <p>
                العمال والوظائف والأجور
            </p>

        </button>


        <button
            class="module materials"
            onclick="openModule('المخزن والمواد')">

            <div class="module-icon">
                🧱
            </div>

            <h3>المخزن والمواد</h3>

            <p>
                الدخول والخروج والمخزون
            </p>

        </button>


        <button
            class="module attendance"
            onclick="openModule('الحضور')">

            <div class="module-icon">
                🕘
            </div>

            <h3>الحضور</h3>

            <p>
                متابعة حضور العمال
            </p>

        </button>


        <button
            class="module expenses"
            onclick="openModule('المصاريف')">

            <div class="module-icon">
                💰
            </div>

            <h3>المصاريف</h3>

            <p>
                مصاريف ومدفوعات المشروع
            </p>

        </button>


        <button
            class="module reports"
            onclick="openModule('التقارير اليومية')">

            <div class="module-icon">
                📋
            </div>

            <h3>التقارير اليومية</h3>

            <p>
                ماذا أنجزنا اليوم؟
            </p>

        </button>


        <button
            class="module appointments"
            onclick="openModule('المواعيد')">

            <div class="module-icon">
                📅
            </div>

            <h3>المواعيد</h3>

            <p>
                مواعيد واجتماعات المشروع
            </p>

        </button>


        <button
            class="module meetings"
            onclick="openModule('الاجتماعات')">

            <div class="module-icon">
                🤝
            </div>

            <h3>الاجتماعات</h3>

            <p>
                تنظيم اجتماعات الفريق
            </p>

        </button>


        <button
            class="module chat"
            onclick="openModule('المحادثة')">

            <div class="module-icon">
                💬
            </div>

            <h3>محادثة المشروع</h3>

            <p>
                تواصل العمال والمهندسين
            </p>

        </button>


        <button
            class="module photos"
            onclick="openModule('صور المشروع')">

            <div class="module-icon">
                📷
            </div>

            <h3>صور المشروع</h3>

            <p>
                توثيق مراحل الإنجاز
            </p>

        </button>


        <button
            class="module notifications"
            onclick="openModule('الإشعارات')">

            <div class="module-icon">
                🔔
            </div>

            <h3>الإشعارات</h3>

            <p>
                تنبيهات المشروع
            </p>

        </button>

    </div>


    <!-- DETAILS -->

    <div class="section-title">

        <h2>
            معلومات المشروع
        </h2>

    </div>


    <div class="details">

        <div class="detail">
            <span>العميل</span>
            <strong id="clientName">—</strong>
        </div>

        <div class="detail">
            <span>المهندس</span>
            <strong id="engineerName">—</strong>
        </div>

        <div class="detail">
            <span>تاريخ البداية</span>
            <strong id="startDate">—</strong>
        </div>

        <div class="detail">
            <span>تاريخ النهاية</span>
            <strong id="endDate">—</strong>
        </div>

        <div class="detail">
            <span>الميزانية</span>
            <strong id="budget">—</strong>
        </div>

        <div class="detail">
            <span>ملاحظات</span>
            <strong id="notes">—</strong>
        </div>

    </div>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <div class="bottom-inner">

        <button
            class="bottom-item"
            onclick="location.href='/'">

            <div>⌂</div>
            الرئيسية

        </button>


        <button
            class="bottom-item active">

            <div>🏗️</div>
            المشروع

        </button>


        <button
            class="bottom-item"
            onclick="location.href='/projects.html'">

            <div>📁</div>
            المشاريع

        </button>

    </div>

</nav>

</div>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const projectId =
    params.get("id");


function money(value){

    const number =
        Number(value || 0);

    return number.toLocaleString(
        "ar-DZ"
    ) + " دج";
}


function goBack(){

    window.location.href =
        "/projects.html";

}


async function loadProject(){

    if(!projectId){

        alert(
            "رقم المشروع غير موجود"
        );

        goBack();

        return;
    }


    try{

        const response =
            await fetch(
                "/api/projects/" +
                projectId +
                "/full"
            );


        const data =
            await response.json();


        if(!response.ok ||
           !data.success){

            throw new Error(
                data.message ||
                "تعذر تحميل المشروع"
            );

        }


        const project =
            data.project;


        document.getElementById(
            "projectName"
        ).textContent =
            project.name || "المشروع";


        document.getElementById(
            "projectLocation"
        ).textContent =
            project.location ||
            "الموقع غير محدد";


        document.getElementById(
            "projectStatus"
        ).textContent =
            project.status ||
            "قيد التنفيذ";


        const progress =
            Number(
                project.progress || 0
            );


        document.getElementById(
            "progressValue"
        ).textContent =
            progress + "%";


        document.getElementById(
            "progressFill"
        ).style.width =
            Math.max(
                0,
                Math.min(
                    100,
                    progress
                )
            ) + "%";


        document.getElementById(
            "workersCount"
        ).textContent =
            (data.workers || []).length;


        document.getElementById(
            "materialsCount"
        ).textContent =
            (data.materials || []).length;


        document.getElementById(
            "appointmentsCount"
        ).textContent =
            (data.appointments || []).length;


        const expenses =
            data.expenses || [];


        const totalExpenses =
            expenses.reduce(
                (sum, item) =>
                    sum +
                    Number(
                        item.amount || 0
                    ),
                0
            );


        document.getElementById(
            "expensesTotal"
        ).textContent =
            money(totalExpenses);


        document.getElementById(
            "clientName"
        ).textContent =
            project.client_name ||
            "غير محدد";


        document.getElementById(
            "engineerName"
        ).textContent =
            project.engineer_name ||
            "غير محدد";


        document.getElementById(
            "startDate"
        ).textContent =
            project.start_date ||
            "غير محدد";


        document.getElementById(
            "endDate"
        ).textContent =
            project.end_date ||
            "غير محدد";


        document.getElementById(
            "budget"
        ).textContent =
            money(project.budget);


        document.getElementById(
            "notes"
        ).textContent =
            project.notes ||
            "لا توجد ملاحظات";


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "app"
        ).style.display =
            "block";


    }catch(error){

        console.error(error);

        document.getElementById(
            "loading"
        ).innerHTML =
            `
            <div style="
                background:white;
                margin:20px;
                padding:25px;
                border-radius:20px;
                box-shadow:var(--shadow);
            ">

                <div style="
                    font-size:40px;
                    margin-bottom:10px;
                ">
                    ⚠️
                </div>

                <strong>
                    تعذر تحميل المشروع
                </strong>

                <p style="
                    font-size:12px;
                    color:#68757A;
                ">
                    ${error.message}
                </p>

                <button
                    onclick="goBack()"
                    style="
                        border:0;
                        padding:12px 20px;
                        border-radius:12px;
                        background:#123B4A;
                        color:white;
                        font-family:inherit;
                        font-weight:800;
                    ">
                    العودة للمشاريع
                </button>

            </div>
            `;

    }

}


function openModule(name){

    alert(
        "📌 " +
        name +
        "\n\nسيتم تجهيز هذا القسم وربطه بالمشروع الحالي في الخطوة القادمة."
    );

}


loadProject();

</script>

</body>
</html>
