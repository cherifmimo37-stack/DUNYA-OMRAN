<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المشاريع | دنيا العمران والترقية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
    --petroleum:#123B4A;
    --dark:#0B2934;
    --green:#3F6B63;
    --copper:#C47735;
    --ivory:#F5F3EE;
    --gray:#68757A;
    --white:#ffffff;
    --danger:#B84040;
    --shadow:0 10px 30px rgba(11,41,52,.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Cairo",sans-serif;
    background:var(--ivory);
    color:var(--dark);
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.header{
    background:linear-gradient(135deg,var(--dark),var(--petroleum));
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:48px;
    height:48px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--copper),#e0a260);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:24px;
    box-shadow:0 5px 15px rgba(196,119,53,.3);
}

.brand-text h1{
    font-size:18px;
    font-weight:900;
}

.brand-text span{
    font-size:11px;
    opacity:.75;
}

.back-btn{
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);
    color:white;
    border-radius:12px;
    padding:10px 15px;
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
    transition:.2s;
}

.back-btn:hover{
    background:rgba(255,255,255,.15);
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:25px 18px 50px;
}

.page-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.page-title h2{
    font-size:28px;
    font-weight:900;
    color:var(--dark);
}

.page-title p{
    color:var(--gray);
    font-size:13px;
    margin-top:3px;
}

.add-btn{
    background:linear-gradient(135deg,var(--copper),#d89250);
    color:white;
    border:none;
    border-radius:14px;
    padding:13px 20px;
    font-family:inherit;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(196,119,53,.22);
    transition:.2s;
}

.add-btn:hover{
    transform:translateY(-2px);
}

/* =========================
   PROJECT GRID
========================= */

.projects-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.project-card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:var(--shadow);
    border:1px solid rgba(18,59,74,.06);
    transition:.25s;
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

.project-card::before{
    content:"";
    position:absolute;
    top:0;
    right:0;
    left:0;
    height:5px;
    background:linear-gradient(90deg,var(--copper),var(--green));
}

.project-card:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 40px rgba(11,41,52,.15);
}

.project-icon{
    width:52px;
    height:52px;
    border-radius:15px;
    background:#edf3f2;
    color:var(--petroleum);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    margin-bottom:15px;
}

.project-name{
    font-size:19px;
    font-weight:900;
    color:var(--dark);
    margin-bottom:6px;
}

.project-location{
    font-size:12px;
    color:var(--gray);
    margin-bottom:15px;
}

.status-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.status{
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

.status-active{
    background:#e7f3ef;
    color:#276b59;
}

.status-finished{
    background:#e8edf0;
    color:#50616a;
}

.status-paused{
    background:#fff0df;
    color:#a85d20;
}

.status-cancelled{
    background:#f8e4e4;
    color:#a33b3b;
}

.progress-value{
    font-size:12px;
    font-weight:900;
    color:var(--petroleum);
}

.progress{
    width:100%;
    height:8px;
    background:#e8ecec;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:17px;
}

.progress-bar{
    height:100%;
    border-radius:20px;
    background:linear-gradient(90deg,var(--green),var(--copper));
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.info-box{
    background:#f7f8f7;
    border-radius:12px;
    padding:10px;
}

.info-label{
    font-size:10px;
    color:var(--gray);
    margin-bottom:2px;
}

.info-value{
    font-size:12px;
    font-weight:800;
    color:var(--dark);
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:70px 20px;
    color:var(--gray);
}

.loader{
    width:45px;
    height:45px;
    border:4px solid #dfe5e5;
    border-top-color:var(--copper);
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   EMPTY / ERROR
========================= */

.empty{
    grid-column:1/-1;
    background:white;
    border-radius:20px;
    padding:60px 20px;
    text-align:center;
    box-shadow:var(--shadow);
}

.empty-icon{
    font-size:55px;
    margin-bottom:15px;
}

.empty h3{
    font-size:20px;
    margin-bottom:7px;
}

.empty p{
    color:var(--gray);
    font-size:13px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(5,20,25,.65);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:500;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:24px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.modal-header h3{
    font-size:21px;
    font-weight:900;
}

.close-btn{
    width:38px;
    height:38px;
    border:none;
    border-radius:12px;
    background:#f0f2f2;
    color:var(--dark);
    font-size:20px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:12px;
    font-weight:800;
    color:var(--dark);
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid #dce2e2;
    background:#fafbfb;
    border-radius:12px;
    padding:12px;
    font-family:inherit;
    font-size:13px;
    color:var(--dark);
    outline:none;
    transition:.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--copper);
    box-shadow:0 0 0 3px rgba(196,119,53,.10);
    background:white;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.save-btn,
.cancel-btn{
    flex:1;
    padding:13px;
    border:none;
    border-radius:13px;
    font-family:inherit;
    font-weight:800;
    cursor:pointer;
}

.save-btn{
    background:var(--petroleum);
    color:white;
}

.cancel-btn{
    background:#edf0f0;
    color:var(--dark);
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:var(--dark);
    color:white;
    padding:13px 20px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    font-size:13px;
    font-weight:700;
    z-index:1000;
    opacity:0;
    transition:.3s;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:950px){
    .projects-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){

    .header{
        padding:14px;
    }

    .brand-text h1{
        font-size:15px;
    }

    .brand-text span{
        display:none;
    }

    .logo{
        width:42px;
        height:42px;
        font-size:20px;
    }

    .container{
        padding:20px 12px 40px;
    }

    .page-top{
        align-items:flex-start;
    }

    .page-title h2{
        font-size:23px;
    }

    .page-title p{
        font-size:11px;
    }

    .add-btn{
        padding:11px 13px;
        font-size:12px;
        white-space:nowrap;
    }

    .projects-grid{
        grid-template-columns:1fr;
        gap:15px;
    }

    .project-card{
        padding:17px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .modal{
        padding:10px;
    }

    .modal-box{
        padding:18px;
        border-radius:20px;
    }

    .back-btn{
        padding:8px 11px;
        font-size:11px;
    }
}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <div class="brand">

            <div class="logo">
                🏗️
            </div>

            <div class="brand-text">
                <h1>دنيا العمران والترقية</h1>
                <span>نظام تسيير مشاريع البناء والمقاولات</span>
            </div>

        </div>

        <button class="back-btn" onclick="goHome()">
            ← الرئيسية
        </button>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

    <div class="page-top">

        <div class="page-title">
            <h2>المشاريع</h2>
            <p>إدارة ومتابعة جميع مشاريع المؤسسة</p>
        </div>

        <button class="add-btn" onclick="openModal()">
            ＋ مشروع جديد
        </button>

    </div>


    <div id="projectsGrid" class="projects-grid">

        <div class="loading">

            <div class="loader"></div>

            <div>
                جاري تحميل المشاريع...
            </div>

        </div>

    </div>

</main>


<!-- =========================
     ADD PROJECT MODAL
========================= -->

<div id="projectModal" class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>🏗️ إضافة مشروع جديد</h3>

            <button class="close-btn" onclick="closeModal()">
                ×
            </button>

        </div>


        <form id="projectForm">

            <div class="form-grid">

                <div class="form-group full">

                    <label>
                        اسم المشروع *
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="مثال: مشروع بناء 50 مسكن"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        الموقع
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="مثال: غليزان"
                    >

                </div>


                <div class="form-group">

                    <label>
                        اسم العميل
                    </label>

                    <input
                        type="text"
                        id="client_name"
                        placeholder="اسم العميل أو صاحب المشروع"
                    >

                </div>


                <div class="form-group">

                    <label>
                        المهندس المسؤول
                    </label>

                    <input
                        type="text"
                        id="engineer_name"
                        placeholder="اسم المهندس"
                    >

                </div>


                <div class="form-group">

                    <label>
                        الميزانية
                    </label>

                    <input
                        type="number"
                        id="budget"
                        placeholder="0"
                        min="0"
                    >

                </div>


                <div class="form-group">

                    <label>
                        تاريخ البداية
                    </label>

                    <input
                        type="date"
                        id="start_date"
                    >

                </div>


                <div class="form-group">

                    <label>
                        تاريخ النهاية
                    </label>

                    <input
                        type="date"
                        id="end_date"
                    >

                </div>


                <div class="form-group">

                    <label>
                        نسبة الإنجاز %
                    </label>

                    <input
                        type="number"
                        id="progress"
                        placeholder="0"
                        min="0"
                        max="100"
                        value="0"
                    >

                </div>


                <div class="form-group">

                    <label>
                        حالة المشروع
                    </label>

                    <select id="status">

                        <option value="active">
                            قيد الإنجاز
                        </option>

                        <option value="finished">
                            مكتمل
                        </option>

                        <option value="paused">
                            متوقف
                        </option>

                        <option value="cancelled">
                            ملغى
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>
                        ملاحظات
                    </label>

                    <textarea
                        id="notes"
                        placeholder="أدخل أي معلومات أو ملاحظات إضافية..."
                    ></textarea>

                </div>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()"
                >
                    إلغاء
                </button>

                <button
                    type="submit"
                    class="save-btn"
                    id="saveBtn"
                >
                    حفظ المشروع
                </button>

            </div>

        </form>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================
   VARIABLES
========================= */

const projectsGrid =
    document.getElementById("projectsGrid");

const modal =
    document.getElementById("projectModal");

const projectForm =
    document.getElementById("projectForm");

const saveBtn =
    document.getElementById("saveBtn");

let toastTimer = null;


/* =========================
   HOME
========================= */

function goHome(){

    window.location.href = "/";

}


/* =========================
   MODAL
========================= */

function openModal(){

    projectForm.reset();

    document.getElementById("progress").value = 0;

    document.getElementById("status").value = "active";

    modal.classList.add("show");

}


function closeModal(){

    modal.classList.remove("show");

}


modal.addEventListener("click", function(e){

    if(e.target === modal){

        closeModal();

    }

});


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.classList.remove("show");

    }, 3000);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    if(value === null || value === undefined){

        return "";

    }

    return String(value)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   STATUS
========================= */

function getStatusInfo(status){

    switch(status){

        case "finished":

            return {
                text:"مكتمل",
                className:"status-finished"
            };

        case "paused":

            return {
                text:"متوقف",
                className:"status-paused"
            };

        case "cancelled":

            return {
                text:"ملغى",
                className:"status-cancelled"
            };

        case "active":

        default:

            return {
                text:"قيد الإنجاز",
                className:"status-active"
            };

    }

}


/* =========================
   FORMAT MONEY
========================= */

function formatMoney(value){

    const number =
        Number(value || 0);

    return new Intl.NumberFormat(
        "ar-DZ"
    ).format(number);

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(value){

    if(!value){

        return "—";

    }

    try{

        return new Date(value).toLocaleDateString(
            "ar-DZ"
        );

    }catch(e){

        return value;

    }

}


/* =========================
   LOAD PROJECTS
========================= */

async function loadProjects(){

    projectsGrid.innerHTML = `

        <div class="loading">

            <div class="loader"></div>

            <div>
                جاري تحميل المشاريع...
            </div>

        </div>

    `;

    try{

        const response =
            await fetch("/api/projects");

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data =
            await response.json();


        let projects = [];

        if(Array.isArray(data)){

            projects = data;

        }else if(Array.isArray(data.projects)){

            projects = data.projects;

        }else if(Array.isArray(data.data)){

            projects = data.data;

        }


        renderProjects(projects);


    }catch(error){

        console.error(
            "LOAD PROJECTS ERROR:",
            error
        );


        projectsGrid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    تعذر تحميل المشاريع
                </h3>

                <p>
                    تأكد من اتصال الخادم وقاعدة البيانات ثم حاول مرة أخرى.
                </p>

                <button
                    class="add-btn"
                    style="margin-top:18px"
                    onclick="loadProjects()"
                >
                    إعادة المحاولة
                </button>

            </div>

        `;

    }

}


/* =========================
   RENDER PROJECTS
========================= */

function renderProjects(projects){

    if(!projects.length){

        projectsGrid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🏗️
                </div>

                <h3>
                    لا توجد مشاريع بعد
                </h3>

                <p>
                    ابدأ بإضافة أول مشروع للمؤسسة.
                </p>

            </div>

        `;

        return;

    }


    projectsGrid.innerHTML =
        projects.map(project => {

            const status =
                getStatusInfo(project.status);

            const progress =
                Math.min(
                    100,
                    Math.max(
                        0,
                        Number(project.progress || 0)
                    )
                );


            return `

                <div
                    class="project-card"
                    onclick="openProject(${Number(project.id)})"
                >

                    <div class="project-icon">
                        🏗️
                    </div>


                    <div class="project-name">

                        ${escapeHTML(
                            project.name || "مشروع بدون اسم"
                        )}

                    </div>


                    <div class="project-location">

                        📍
                        ${escapeHTML(
                            project.location || "الموقع غير محدد"
                        )}

                    </div>


                    <div class="status-row">

                        <span
                            class="status ${status.className}"
                        >
                            ${status.text}
                        </span>

                        <span class="progress-value">
                            ${progress}%
                        </span>

                    </div>


                    <div class="progress">

                        <div
                            class="progress-bar"
                            style="width:${progress}%"
                        ></div>

                    </div>


                    <div class="info-grid">

                        <div class="info-box">

                            <div class="info-label">
                                العميل
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    project.client_name || "—"
                                )}

                            </div>

                        </div>


                        <div class="info-box">

                            <div class="info-label">
                                المهندس
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    project.engineer_name || "—"
                                )}

                            </div>

                        </div>


                        <div class="info-box">

                            <div class="info-label">
                                الميزانية
                            </div>

                            <div class="info-value">

                                ${formatMoney(
                                    project.budget
                                )} دج

                            </div>

                        </div>


                        <div class="info-box">

                            <div class="info-label">
                                البداية
                            </div>

                            <div class="info-value">

                                ${formatDate(
                                    project.start_date
                                )}

                            </div>

                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   OPEN PROJECT
========================= */

function openProject(id){

    if(!id){

        showToast(
            "رقم المشروع غير صحيح"
        );

        return;

    }

    window.location.href =
        "/project.html?id=" +
        encodeURIComponent(id);

}


/* =========================
   CREATE PROJECT
========================= */

projectForm.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        saveBtn.disabled = true;

        saveBtn.textContent =
            "جاري الحفظ...";


        const project = {

            name:
                document.getElementById("name")
                .value
                .trim(),

            location:
                document.getElementById("location")
                .value
                .trim(),

            client_name:
                document.getElementById("client_name")
                .value
                .trim(),

            engineer_name:
                document.getElementById("engineer_name")
                .value
                .trim(),

            start_date:
                document.getElementById("start_date")
                .value || null,

            end_date:
                document.getElementById("end_date")
                .value || null,

            budget:
                Number(
                    document.getElementById("budget")
                    .value || 0
                ),

            progress:
                Number(
                    document.getElementById("progress")
                    .value || 0
                ),

            status:
                document.getElementById("status")
                .value,

            notes:
                document.getElementById("notes")
                .value
                .trim()

        };


        try{

            const response =
                await fetch(
                    "/api/projects",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(project)
                    }
                );


            const data =
                await response.json()
                .catch(() => ({}));


            if(!response.ok || data.success === false){

                throw new Error(
                    data.message ||
                    "تعذر إنشاء المشروع"
                );

            }


            closeModal();

            showToast(
                "تم إنشاء المشروع بنجاح ✅"
            );


            await loadProjects();


        }catch(error){

            console.error(
                "CREATE PROJECT ERROR:",
                error
            );


            showToast(
                error.message ||
                "تعذر إنشاء المشروع ❌"
            );


        }finally{

            saveBtn.disabled = false;

            saveBtn.textContent =
                "حفظ المشروع";

        }

    }
);


/* =========================
   START
========================= */

loadProjects();

</script>

</body>
</html>
