<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المشاريع | دنيا العمران والترقية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
    --petroleum:#123B4A;
    --dark:#0B2934;
    --green:#3F6B63;
    --copper:#C47735;
    --ivory:#F5F3EE;
    --gray:#68757A;
    --white:#fff;
    --red:#B94A48;
    --shadow:0 10px 30px rgba(11,41,52,.10);
    --radius:18px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Cairo",sans-serif;
    background:var(--ivory);
    color:var(--dark);
    min-height:100vh;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    background:linear-gradient(
        135deg,
        var(--dark),
        var(--petroleum)
    );
    color:white;
    padding:15px 20px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.topbar-inner{
    width:min(1200px,94%);
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back-btn{
    width:44px;
    height:44px;
    border:0;
    border-radius:13px;
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:22px;
}

.back-btn:hover{
    background:rgba(255,255,255,.20);
}

.brand{
    flex:1;
}

.brand h1{
    font-size:19px;
    font-weight:900;
}

.brand p{
    font-size:11px;
    opacity:.75;
}

/* =========================
   MAIN
========================= */

.container{
    width:min(1200px,94%);
    margin:25px auto 50px;
}

/* =========================
   PAGE HEADER
========================= */

.page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.page-title h2{
    font-size:27px;
    font-weight:900;
    color:var(--petroleum);
}

.page-title p{
    color:var(--gray);
    font-size:12px;
    margin-top:3px;
}

.primary-btn{
    border:0;
    background:linear-gradient(
        135deg,
        var(--copper),
        #a95e25
    );
    color:white;
    padding:12px 18px;
    border-radius:13px;
    font-size:13px;
    font-weight:900;
    box-shadow:0 7px 18px rgba(196,119,53,.25);
}

.primary-btn:hover{
    transform:translateY(-1px);
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    background:white;
    border-radius:17px;
    padding:15px;
    box-shadow:var(--shadow);
    display:grid;
    grid-template-columns:1fr 180px;
    gap:12px;
    margin-bottom:20px;
}

.search-box{
    position:relative;
}

.search-box span{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--gray);
}

.search-box input,
.toolbar select{
    width:100%;
    border:1px solid #e0e4e3;
    background:#fafafa;
    border-radius:12px;
    padding:12px 40px 12px 12px;
    outline:none;
    font-size:12px;
    color:var(--dark);
}

.toolbar select{
    padding:12px;
}

.search-box input:focus,
.toolbar select:focus{
    border-color:var(--copper);
    background:white;
}

/* =========================
   PROJECT GRID
========================= */

.projects-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

/* =========================
   PROJECT CARD
========================= */

.project-card{
    background:white;
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
    border:1px solid rgba(18,59,74,.06);
    cursor:pointer;
    transition:.25s ease;
}

.project-card:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 35px rgba(11,41,52,.15);
}

.card-top{
    background:linear-gradient(
        135deg,
        var(--petroleum),
        var(--dark)
    );
    color:white;
    padding:19px;
    position:relative;
}

.card-top::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    left:-30px;
    top:-35px;
}

.card-top-content{
    position:relative;
    z-index:2;
}

.project-name-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.project-name{
    font-size:17px;
    font-weight:900;
    line-height:1.5;
}

.status{
    padding:5px 9px;
    border-radius:30px;
    font-size:9px;
    font-weight:900;
    white-space:nowrap;
}

.status.active{
    background:#d9f0e9;
    color:#236052;
}

.status.pending{
    background:#fff0d8;
    color:#946020;
}

.status.completed{
    background:#dce8ed;
    color:#285261;
}

.status.cancelled{
    background:#f6dede;
    color:#9b3838;
}

.location{
    margin-top:8px;
    color:rgba(255,255,255,.75);
    font-size:11px;
}

.card-body{
    padding:17px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    font-size:11px;
    border-bottom:1px solid #f0f0ee;
}

.info-row:last-child{
    border-bottom:0;
}

.info-label{
    color:var(--gray);
}

.info-value{
    color:var(--dark);
    font-weight:800;
    text-align:left;
}

.progress-wrap{
    margin-top:12px;
}

.progress-head{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    margin-bottom:5px;
}

.progress-percent{
    color:var(--copper);
    font-weight:900;
}

.progress{
    height:8px;
    background:#edf0ef;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:linear-gradient(
        90deg,
        var(--copper),
        #e3a366
    );
    border-radius:20px;
}

.card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:15px;
    padding-top:12px;
    border-top:1px solid #eee;
}

.view-btn{
    border:0;
    background:#edf3f2;
    color:var(--petroleum);
    border-radius:10px;
    padding:8px 12px;
    font-size:10px;
    font-weight:900;
}

.view-btn:hover{
    background:#dfe9e7;
}

.project-id{
    color:#9aa3a6;
    font-size:9px;
}

/* =========================
   EMPTY
========================= */

.empty{
    background:white;
    border-radius:20px;
    padding:55px 20px;
    text-align:center;
    box-shadow:var(--shadow);
    grid-column:1/-1;
}

.empty-icon{
    font-size:48px;
    margin-bottom:10px;
}

.empty h3{
    color:var(--petroleum);
    margin-bottom:6px;
}

.empty p{
    color:var(--gray);
    font-size:12px;
}

/* =========================
   LOADING
========================= */

.loading{
    background:white;
    border-radius:20px;
    padding:55px 20px;
    text-align:center;
    box-shadow:var(--shadow);
    grid-column:1/-1;
    color:var(--gray);
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid #e5e7e7;
    border-top-color:var(--copper);
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 13px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(5,25,32,.65);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:min(650px,100%);
    max-height:92vh;
    overflow-y:auto;
    border-radius:22px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-header{
    background:linear-gradient(
        135deg,
        var(--dark),
        var(--petroleum)
    );
    color:white;
    padding:19px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.modal-header h3{
    font-size:18px;
    font-weight:900;
}

.close-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:11px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:20px;
}

.modal-body{
    padding:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:11px;
    font-weight:800;
    color:var(--petroleum);
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid #dfe4e3;
    background:#fafafa;
    border-radius:11px;
    padding:11px;
    outline:none;
    font-size:12px;
    color:var(--dark);
}

.form-group textarea{
    resize:vertical;
    min-height:90px;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--copper);
    background:white;
}

.modal-footer{
    padding:15px 20px 20px;
    display:flex;
    justify-content:flex-start;
    gap:10px;
}

.cancel-btn{
    border:0;
    background:#edf0ef;
    color:var(--dark);
    padding:11px 18px;
    border-radius:11px;
    font-weight:800;
}

.save-btn{
    border:0;
    background:var(--petroleum);
    color:white;
    padding:11px 20px;
    border-radius:11px;
    font-weight:900;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(100px);
    background:var(--dark);
    color:white;
    padding:12px 20px;
    border-radius:13px;
    font-size:12px;
    font-weight:700;
    opacity:0;
    transition:.3s;
    z-index:2000;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:950px){

    .projects-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    .container{
        width:94%;
        margin-top:17px;
    }

    .page-header{
        align-items:flex-start;
    }

    .page-title h2{
        font-size:22px;
    }

    .primary-btn{
        padding:10px 12px;
        font-size:11px;
    }

    .toolbar{
        grid-template-columns:1fr;
    }

    .projects-grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .modal-header h3{
        font-size:16px;
    }

}
</style>
</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <button
            class="back-btn"
            onclick="goHome()"
            title="الرئيسية">
            ←
        </button>

        <div class="brand">
            <h1>دنيا العمران والترقية</h1>
            <p>نظام تسيير مشاريع البناء والمقاولات</p>
        </div>

        <button
            class="back-btn"
            onclick="loadProjects()"
            title="تحديث المشاريع">
            ↻
        </button>

    </div>

</header>


<main class="container">

    <!-- HEADER -->

    <section class="page-header">

        <div class="page-title">

            <h2>المشاريع</h2>

            <p>
                جميع مشاريع الشركة ومتابعة تقدمها
            </p>

        </div>

        <button
            class="primary-btn"
            onclick="openModal()">
            ＋ مشروع جديد
        </button>

    </section>


    <!-- SEARCH -->

    <section class="toolbar">

        <div class="search-box">

            <span>🔎</span>

            <input
                id="searchInput"
                type="search"
                placeholder="ابحث عن مشروع، موقع أو عميل..."
                oninput="filterProjects()">

        </div>


        <select
            id="statusFilter"
            onchange="filterProjects()">

            <option value="all">
                كل الحالات
            </option>

            <option value="active">
                نشط
            </option>

            <option value="pending">
                قيد الانتظار
            </option>

            <option value="completed">
                مكتمل
            </option>

            <option value="cancelled">
                ملغى
            </option>

        </select>

    </section>


    <!-- PROJECTS -->

    <section
        id="projectsGrid"
        class="projects-grid">

        <div class="loading">

            <div class="spinner"></div>

            <div>
                جاري تحميل المشاريع...
            </div>

        </div>

    </section>

</main>


<!-- =========================
     NEW PROJECT MODAL
========================= -->

<div
    id="projectModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                🏗️ إنشاء مشروع جديد
            </h3>

            <button
                class="close-btn"
                onclick="closeModal()">
                ×
            </button>

        </div>


        <form
            id="projectForm"
            onsubmit="createProject(event)">

            <div class="modal-body">

                <div class="form-grid">

                    <div class="form-group full">

                        <label>
                            اسم المشروع *
                        </label>

                        <input
                            id="name"
                            name="name"
                            required
                            placeholder="مثال: مشروع بناء 40 مسكن">

                    </div>


                    <div class="form-group">

                        <label>
                            الموقع
                        </label>

                        <input
                            id="location"
                            name="location"
                            placeholder="المدينة / البلدية">

                    </div>


                    <div class="form-group">

                        <label>
                            صاحب المشروع
                        </label>

                        <input
                            id="client_name"
                            name="client_name"
                            placeholder="اسم العميل">

                    </div>


                    <div class="form-group">

                        <label>
                            المهندس
                        </label>

                        <input
                            id="engineer_name"
                            name="engineer_name"
                            placeholder="اسم المهندس">

                    </div>


                    <div class="form-group">

                        <label>
                            الميزانية
                        </label>

                        <input
                            id="budget"
                            name="budget"
                            type="number"
                            min="0"
                            step="0.01"
                            placeholder="0">

                    </div>


                    <div class="form-group">

                        <label>
                            تاريخ البداية
                        </label>

                        <input
                            id="start_date"
                            name="start_date"
                            type="date">

                    </div>


                    <div class="form-group">

                        <label>
                            تاريخ النهاية
                        </label>

                        <input
                            id="end_date"
                            name="end_date"
                            type="date">

                    </div>


                    <div class="form-group">

                        <label>
                            نسبة الإنجاز %
                        </label>

                        <input
                            id="progress"
                            name="progress"
                            type="number"
                            min="0"
                            max="100"
                            value="0">

                    </div>


                    <div class="form-group">

                        <label>
                            الحالة
                        </label>

                        <select
                            id="status"
                            name="status">

                            <option value="active">
                                نشط
                            </option>

                            <option value="pending">
                                قيد الانتظار
                            </option>

                            <option value="completed">
                                مكتمل
                            </option>

                            <option value="cancelled">
                                ملغى
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label>
                            ملاحظات
                        </label>

                        <textarea
                            id="notes"
                            name="notes"
                            placeholder="اكتب أي ملاحظات خاصة بالمشروع..."></textarea>

                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()">
                    إلغاء
                </button>

                <button
                    id="saveBtn"
                    type="submit"
                    class="save-btn">
                    حفظ المشروع
                </button>

            </div>

        </form>

    </div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

/* =========================================================
   DATA
========================================================= */

let allProjects = [];


/* =========================================================
   HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}


function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatMoney(value){

    const number = Number(value || 0);

    return number.toLocaleString("ar-DZ") + " دج";
}


function formatDate(value){

    if(!value){
        return "—";
    }

    try{

        const date = new Date(value);

        if(Number.isNaN(date.getTime())){
            return escapeHTML(value);
        }

        return date.toLocaleDateString(
            "ar-DZ",
            {
                year:"numeric",
                month:"short",
                day:"numeric"
            }
        );

    }catch(error){

        return escapeHTML(value);

    }
}


function showToast(message){

    const toast = $("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2500);
}


/* =========================================================
   STATUS
========================================================= */

function getStatusInfo(status){

    const value =
        String(status || "").toLowerCase();


    if(
        value === "completed" ||
        value.includes("مكتمل") ||
        value.includes("منتهي")
    ){

        return {
            text:"مكتمل",
            className:"completed"
        };

    }


    if(
        value === "pending" ||
        value.includes("قيد") ||
        value.includes("انتظار")
    ){

        return {
            text:"قيد الانتظار",
            className:"pending"
        };

    }


    if(
        value === "cancelled" ||
        value.includes("ملغ")
    ){

        return {
            text:"ملغى",
            className:"cancelled"
        };

    }


    return {
        text:"نشط",
        className:"active"
    };

}


/* =========================================================
   LOAD PROJECTS
========================================================= */

async function loadProjects(){

    const grid =
        $("projectsGrid");


    grid.innerHTML = `
        <div class="loading">

            <div class="spinner"></div>

            <div>
                جاري تحميل المشاريع...
            </div>

        </div>
    `;


    try{

        const response =
            await fetch("/api/projects");


        if(!response.ok){

            throw new Error(
                "تعذر الاتصال بالخادم."
            );

        }


        const data =
            await response.json();


        if(Array.isArray(data)){

            allProjects = data;

        }else if(
            data &&
            Array.isArray(data.projects)
        ){

            allProjects =
                data.projects;

        }else{

            allProjects = [];

        }


        filterProjects();


    }catch(error){

        console.error(
            "LOAD PROJECTS ERROR:",
            error
        );


        grid.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    تعذر تحميل المشاريع
                </h3>

                <p>
                    ${escapeHTML(
                        error.message ||
                        "حدث خطأ غير معروف."
                    )}
                </p>

                <br>

                <button
                    class="primary-btn"
                    onclick="loadProjects()">
                    إعادة المحاولة
                </button>

            </div>
        `;

    }

}


/* =========================================================
   FILTER
========================================================= */

function filterProjects(){

    const search =
        $("searchInput")
            .value
            .trim()
            .toLowerCase();


    const status =
        $("statusFilter")
            .value;


    const filtered =
        allProjects.filter(project=>{

            const searchable = [
                project.name,
                project.location,
                project.client_name,
                project.engineer_name,
                project.notes
            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            const matchesSearch =
                !search ||
                searchable.includes(search);


            let matchesStatus = true;


            if(status !== "all"){

                const projectStatus =
                    String(
                        project.status ||
                        "active"
                    )
                    .toLowerCase();


                matchesStatus =
                    projectStatus === status;

            }


            return (
                matchesSearch &&
                matchesStatus
            );

        });


    renderProjects(filtered);

}


/* =========================================================
   RENDER PROJECTS
========================================================= */

function renderProjects(projects){

    const grid =
        $("projectsGrid");


    if(!projects.length){

        grid.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    🏗️
                </div>

                <h3>
                    لا توجد مشاريع
                </h3>

                <p>
                    لم يتم العثور على مشروع مطابق للبحث.
                </p>

            </div>
        `;

        return;
    }


    let html = "";


    projects.forEach(project=>{

        const statusInfo =
            getStatusInfo(project.status);


        const progress =
            Math.max(
                0,
                Math.min(
                    100,
                    Number(
                        project.progress || 0
                    )
                )
            );


        html += `
            <article
                class="project-card"
                onclick="openProject(${Number(project.id)})">

                <div class="card-top">

                    <div class="card-top-content">

                        <div class="project-name-row">

                            <div class="project-name">
                                ${escapeHTML(
                                    project.name ||
                                    "مشروع بدون اسم"
                                )}
                            </div>

                            <span
                                class="status ${statusInfo.className}">
                                ${statusInfo.text}
                            </span>

                        </div>

                        <div class="location">
                            📍 ${escapeHTML(
                                project.location ||
                                "الموقع غير محدد"
                            )}
                        </div>

                    </div>

                </div>


                <div class="card-body">

                    <div class="info-row">

                        <span class="info-label">
                            صاحب المشروع
                        </span>

                        <span class="info-value">
                            ${escapeHTML(
                                project.client_name ||
                                "—"
                            )}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            المهندس
                        </span>

                        <span class="info-value">
                            ${escapeHTML(
                                project.engineer_name ||
                                "—"
                            )}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            الميزانية
                        </span>

                        <span class="info-value">
                            ${
                                project.budget !== null &&
                                project.budget !== undefined &&
                                project.budget !== ""
                                    ? formatMoney(
                                        project.budget
                                    )
                                    : "—"
                            }
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            المدة
                        </span>

                        <span class="info-value">

                            ${formatDate(
                                project.start_date
                            )}

                            →

                            ${formatDate(
                                project.end_date
                            )}

                        </span>

                    </div>


                    <div class="progress-wrap">

                        <div class="progress-head">

                            <span>
                                نسبة الإنجاز
                            </span>

                            <span class="progress-percent">
                                ${progress}%
                            </span>

                        </div>

                        <div class="progress">

                            <div
                                class="progress-bar"
                                style="width:${progress}%">
                            </div>

                        </div>

                    </div>


                    <div class="card-footer">

                        <span class="project-id">
                            مشروع #${Number(project.id)}
                        </span>

                        <button
                            class="view-btn"
                            onclick="event.stopPropagation();openProject(${Number(project.id)})">
                            عرض المشروع →
                        </button>

                    </div>

                </div>

            </article>
        `;

    });


    grid.innerHTML = html;

}


/* =========================================================
   OPEN PROJECT
========================================================= */

function openProject(id){

    if(!id){

        showToast(
            "رقم المشروع غير صحيح"
        );

        return;
    }


    window.location.href =
        "/project.html?id=" +
        encodeURIComponent(id);

}


/* =========================================================
   MODAL
========================================================= */

function openModal(){

    $("projectModal")
        .classList.add("show");

    setTimeout(()=>{
        $("name").focus();
    },100);

}


function closeModal(){

    $("projectModal")
        .classList.remove("show");

}


$("projectModal")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){
                closeModal();
            }

        }
    );


/* =========================================================
   CREATE PROJECT
========================================================= */

async function createProject(event){

    event.preventDefault();


    const saveBtn =
        $("saveBtn");


    saveBtn.disabled = true;

    saveBtn.textContent =
        "جاري الحفظ...";


    const payload = {

        name:
            $("name").value.trim(),

        location:
            $("location").value.trim(),

        client_name:
            $("client_name").value.trim(),

        engineer_name:
            $("engineer_name").value.trim(),

        budget:
            $("budget").value
                ? Number(
                    $("budget").value
                )
                : 0,

        start_date:
            $("start_date").value ||
            null,

        end_date:
            $("end_date").value ||
            null,

        progress:
            Number(
                $("progress").value || 0
            ),

        status:
            $("status").value,

        notes:
            $("notes").value.trim()

    };


    if(!payload.name){

        showToast(
            "اكتب اسم المشروع أولاً"
        );

        saveBtn.disabled = false;

        saveBtn.textContent =
            "حفظ المشروع";

        return;
    }


    try{

        const response =
            await fetch(
                "/api/projects",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(payload)
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "تعذر إنشاء المشروع."
            );

        }


        showToast(
            "تم إنشاء المشروع بنجاح ✅"
        );


        closeModal();


        $("projectForm")
            .reset();


        $("progress").value = 0;

        $("status").value =
            "active";


        await loadProjects();


    }catch(error){

        console.error(
            "CREATE PROJECT ERROR:",
            error
        );


        showToast(
            error.message ||
            "تعذر إنشاء المشروع."
        );

    }finally{

        saveBtn.disabled = false;

        saveBtn.textContent =
            "حفظ المشروع";

    }

}


/* =========================================================
   NAVIGATION
========================================================= */

function goHome(){

    window.location.href =
        "/";

}

   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeModal();

        }

    }
);


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadProjects();

    }
);

</script>
